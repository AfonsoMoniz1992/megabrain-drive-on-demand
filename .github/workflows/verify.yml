name: verify-release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev
      - name: Identity gate self-test and built-in pattern scan
        run: |
          # The gate's own scenarios run with generated fixtures, so no external
          # deny-list is needed here. The scan itself then runs with built-in
          # patterns only, which the tool reports as non-authoritative: an
          # authoritative run needs the operator's out-of-tree deny-list and is
          # documented in docs/RUNBOOK.md section 8.
          bash scripts/identity-scan-selftest.sh
          IDENTITY_ALLOW_NO_DENYLIST=1 python3 scripts/identity_scan.py .
      - name: Verify release artifact allowlist
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          test "$(node -p "require('./manifest.json').version")" = "$(node -p "require('./package.json').version")"
      - name: Verify committed artifacts are reproducible from source
        run: |
          # A release artifact must be generated from the tagged source, not merely
          # present: rebuild and fail if the committed main.js drifts from source.
          npm run build
          npm run broker:build
          git diff --exit-code -- main.js
      - name: Emit artifact checksums
        run: sha256sum manifest.json main.js styles.css | tee checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: obsidian-gdrive-streaming
          path: |
            manifest.json
            main.js
            styles.css
            checksums.txt
